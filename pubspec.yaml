name: localport
description: Open-source AirDrop alternative — P2P file and clipboard sharing on the LAN.
publish_to: "none"
version: 0.1.0+1
repository: https://github.com/ege-ayan/localport

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  bonsoir: ^7.1.6
  cryptography: ^2.9.0
  cupertino_icons: ^1.0.8
  desktop_drop: ^0.7.1
  file_picker: ^13.3.1
  flutter_riverpod: ^3.0.3
  intl: ^0.20.2
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.15
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  isar_community_generator: ^3.3.2

flutter:
  uses-material-design: true
